# Relay Server Configuration Example (nginx)
#
# This file shows how to configure a cloud relay server using nginx.
# The relay server acts as a bridge between mobile clients and the router.
#
# Prerequisites:
#   - A public cloud VM with nginx installed
#   - A domain name pointing to the server
#   - SSL certificate (Let's Encrypt recommended)
#
# Install nginx on Ubuntu/Debian:
#   apt install nginx certbot python3-certbot-nginx
#   certbot --nginx -d your-domain.com

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Prefer forward-secret ciphers; include both GCM-SHA256 and GCM-SHA384
    # for broad client compatibility (Android 5+, WeChat)
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    ssl_prefer_server_ciphers on;

    # Mobile client API requests — forwarded to router via relay
    location /api/ {
        # This location is handled by the relay middleware
        # (see relay-server application setup below)
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Router registration WebSocket endpoint
    location /relay/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

# ─── SSH Reverse Tunnel Setup ─────────────────────────────────────────────────
#
# For SSH mode, the router connects via SSH reverse tunnel.
# On the relay server:
#
# 1. Create a dedicated user:
#    adduser --disabled-password --gecos "" relay
#
# 2. Configure sshd (/etc/ssh/sshd_config):
#    AllowUsers relay
#    GatewayPorts yes          # Allow binding remote port to 0.0.0.0
#    Match User relay
#      AllowTcpForwarding yes
#      X11Forwarding no
#      PermitTTY no
#      ForceCommand echo "relay connection established"
#
# 3. Add router's public key to relay user's authorized_keys:
#    mkdir -p /home/relay/.ssh
#    cat /etc/relay_id_ed25519.pub >> /home/relay/.ssh/authorized_keys
#    chown -R relay:relay /home/relay/.ssh
#    chmod 700 /home/relay/.ssh
#    chmod 600 /home/relay/.ssh/authorized_keys
#
# 4. Now mobile clients can access the router API at:
#    https://your-domain.com:18443/api/v1/...
#
# The router will maintain a reverse tunnel:
#    Router -> SSH -> relay-server:22 -> remote port 18443 -> router:8443
